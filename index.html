<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TrueHit™ Master Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        /* 定義全域 CSS 變數，方便統一管理高強度霓虹戰術色彩與動態間距 */
        :root {
            --neon-cyan: #00FFFF; /* 科技青色：主要用於意圖鎖定與選手資訊 */
            --neon-orange: #FF9100; /* 警示橘色：用於 AI 區塊、結果與技術偏差提示 */
            --neon-lime: #CCFF00; /* 萊姆綠色：用於 THI 指標穩定度高亮 */
            --unit-h: 1vh; /* 視窗高度百分之一的自訂單位 */
            --stack-gap: min(1vh, 6px); /* 【版面優化】：縮小全域間距 (1.5vh/10px -> 1vh/6px)，讓元件高度結合更緊密 */
        }

        /* 定義常規結算按鈕或結果提示的橘色呼吸燈動畫效果 */
        @keyframes pulse-orange { 0% { box-shadow: 0 0 0 0 rgba(255, 145, 0, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(255, 145, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 145, 0, 0); } }
        /* 定義關鍵「壓力模式」開啟時，按鈕的紅色高能呼吸燈動畫效果 */
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        /* Phase A 選擇擊球意圖時，九宮格邊框的高亮度藍色呼吸燈動態效果 */
        @keyframes intent-glow { 0% { border-color: rgba(0, 255, 255, 0.4); } 50% { border-color: rgba(0, 255, 255, 1); box-shadow: 0 0 15px rgba(0, 255, 255, 0.4); } 100% { border-color: rgba(0, 255, 255, 0.4); } }
        
        /* 全域網頁主體樣式設定 */
        body { 
            background-color: #000; /* 純黑背景，營造戰術終端機專業氛圍 */
            color: #fff; /* 全域文字預設為白色 */
            font-family: 'Inter', sans-serif; /* 預設使用 Inter 字型 */
            overflow: hidden; /* 鎖定畫面，隱藏滾動條，確保完美的單頁式 App 體驗 */
            height: 100vh; /* 高度撐滿整個瀏覽器畫面 */
            padding: 8px 15px calc(8px + env(safe-area-inset-bottom)); /* 微調上下留白，避開 iOS Home 條安全區域 */
            display: flex; /* 使用 Flexbox 彈性排版 */
            flex-direction: column; /* 子元素一律由上至下垂直排列 */
            box-sizing: border-box; /* 確保內邊距與邊框不撐大總寬高 */
            -webkit-tap-highlight-color: transparent; /* 移除行動裝置上點擊按鈕時原生出現的藍色高亮區塊 */
        }

        /* 類別：將字型切換為 JetBrains Mono 等寬字型，用於對齊數字與指標 */
        .mono { font-family: 'JetBrains Mono', monospace; }
        /* 類別：將元素強制隱藏，並提高權重 */
        .hidden { display: none !important; }

        /* 1. 上方儀表板區塊 (佔 15% 畫面高度) */
        .dashboard-row { 
            height: 15vh; /* 高度固定為視窗的 15% */
            display: flex; /* 水平排列子元素 */
            align-items: center; /* 垂直方向置中對齊 */
            justify-content: space-between; /* 左右對齊，中間留白 */
            gap: 10px; /* 子元素之間的水平間距 */
            flex-shrink: 0; /* 防止此區塊被下方爆開的元素擠壓變形 */
        }
        /* 儀表板內的數據方塊基礎樣式 */
        .hud-box {
            flex: 1; /* 平均分配剩餘的水平空間 */
            height: 100%; /* 高度完全撐滿父層的 15vh */
            border-radius: 12px; /* 優雅的圓角化 */
            display: flex; /* 內部使用彈性排版 */
            flex-direction: column; /* 內容由上至下垂直排列 */
            justify-content: center; /* 垂直置中 */
            align-items: center; /* 水平置中 */
            padding: 4px; /* 內部微幅留白 */
            border: 2.5px solid transparent; /* 預設邊框透明，保留位置給動態顏色 */
        }
        /* THI 指標容器專屬樣式：使用萊姆綠邊框與微弱的背景色 */
        #thi-container { border-color: var(--neon-lime); background: rgba(204, 255, 0, 0.05); }
        /* THI 指標大數字樣式，隨螢幕大小自動在 28px 到 40px 之間彈性縮放 */
        #thi-display { font-size: clamp(28px, 4.5vh, 40px); line-height: 1; font-weight: 900; margin: 4px 0; }
        
        /* 選手資訊方塊專屬樣式：科技青色邊框與半透明背景，支援點擊更新 */
        .player-box { border-color: var(--neon-cyan); background: rgba(0, 255, 255, 0.1); cursor: pointer; }
        /* 選手名字字型縮放樣式：粗體加強 */
        #player-name { font-size: clamp(14px, 2.2vh, 18px); font-weight: 900; }
        /* 選手差點 (HDCP) 數值字體大小 */
        #player-hdcp { font-size: clamp(18px, 2.8vh, 24px); }

        /* 正中間圓形 IVR 同步率儀表 */
        .ivr-indicator { 
            width: 28vw; height: 28vw; max-width: 15vh; max-height: 15vh; /* 鎖定長寬比，在不同裝置上維持完美正圓形 */
            border-radius: 50%; border: 6px solid var(--neon-cyan); /* 青色粗邊框圓圈 */
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            background: rgba(0, 255, 255, 0.05); flex-shrink: 0; /* 防止圓形被擠壓變形 */
        }

        /* 2. AI 教練診斷提示區塊 (佔 15% 畫面高度) */
        #ai-box { 
            height: 15vh; /* 高度固定為視窗的 15% */
            border: 2.5px solid var(--neon-orange); border-left: 10px solid var(--neon-orange); /* 左側加粗，呈現戰術提示卡視覺 */
            border-radius: 14px; background: linear-gradient(145deg, #1a1000, #000000); /* 質感的黑橘暗化漸層 */
            display: flex; flex-direction: column; justify-content: center; 
            padding: 10px 18px; 
            margin: var(--stack-gap) 0; /* 縮小與上下區塊的間距 */
            overflow: hidden; /* 超出區塊的文字自動隱藏 */
            box-shadow: 0 4px 20px rgba(255,145,0,0.15); /* 微弱的橘色霓虹發光陰影 */
        }
        /* AI 指導診斷文字的大小與間距設定 */
        #ai-text { font-size: clamp(15px, 2.5vh, 20px); font-weight: 700; line-height: 1.3; color: #eee; }

        /* 3. 中間控制按鈕與球桿群組 (佔 30% 畫面高度) */
        .control-stack { 
            display: flex; 
            flex-direction: column; 
            gap: var(--stack-gap); 
            height: 30vh; 
            flex-shrink: 0; 
            margin-bottom: var(--stack-gap); /* 【細節調整】：緊縮球桿按鈕與下方 Phase A 區塊的底部間距 */
        }
        /* 頂部細長字的「結束本場球局與覆盤分析」按鈕 */
        .finalize-btn { height: 5vh; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; font-size: 9px; color: #555; font-weight: 900; text-transform: uppercase; }
        /* 核心「壓力模式」切換開關，字體放大且加寬字距 */
        .pressure-btn { height: 8vh; background: #111; border: 2.5px solid #333; border-radius: 14px; font-size: clamp(14px, 2.2vh, 18px); letter-spacing: 0.3em; font-weight: 900; }
        /* 當壓力模式被啟用（Active）時的紅色警示樣式與呼吸燈動畫觸發 */
        .pressure-btn.active { background: rgba(239, 68, 68, 0.3); border-color: #ef4444; animation: pulse-red 1.5s infinite; }
        
        /* 球桿選單水平列佈局 */
        .club-row { height: 10vh; display: flex; gap: 6px; }
        /* 個別球桿按鈕基本樣式：深邃背景襯托橘色文字 */
        .club-btn { 
            flex: 1; border: 2px solid #333; border-radius: 10px; 
            font-size: clamp(12px, 2.2vh, 17px); /* 球桿文字等比放大，方便手動高頻操作 */
            font-weight: 900; color: var(--neon-orange); background: #050505; 
        }
        /* 當前選中的球桿按鈕：轉為高亮青色底色與黑色粗字 */
        .club-btn.active { border-color: var(--neon-cyan); background: var(--neon-cyan); color: #000 !important; }

        /* 4. 九宮格主要操作面板區域 (確保不高於 30vh 且絕不爆版超出螢幕) */
        .grid-container { 
            flex-grow: 1; 
            position: relative; 
            height: 30vh; 
            max-height: 30vh; /* 強制重申最大高度限制，卡死高度 */
            min-height: 0; 
        }
        /* 操作階段提示條（PHASE A: 選意圖 / PHASE B: 記結果） */
        #status-lamp { 
            height: 4vh; /* 縮微提示燈高度，撥出實體高度空間給下方九宮格 */
            border-radius: 8px; 
            font-weight: 900; 
            margin-bottom: var(--stack-gap); /* 套用緊縮後的 gap 變數 */
            font-size: clamp(11px, 1.8vh, 14px); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
        }
        /* 意圖模式下的狀態條樣式：柔和青色調 */
        .lamp-intent { background: rgba(0, 255, 255, 0.25); border: 1.5px solid var(--neon-cyan); color: var(--neon-cyan); }
        /* 結果記錄模式下的狀態條樣式：高度警示橘色加上呼吸燈閃爍 */
        .lamp-result { background: rgba(255, 145, 0, 0.35); border: 2px solid var(--neon-orange); color: #fff; animation: pulse-orange 1.5s infinite; }

        /* 九宮格佈局圖層，利用 CSS Grid 自動切成完美的 3x3 戰術矩陣 */
        .grid-layer { 
            position: absolute; 
            top: 4.5vh; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(3, 1fr); 
            gap: 8px; /* 微幅緊縮間距 (10px -> 8px)，幫底部的 SHORT 按鈕爭取安全空間 */
        }
        /* 單一九宮格格子的基礎樣式 - 具備多重置中防線 */
        .grid-cell { 
            border-radius: 14px; 
            display: flex; 
            flex-direction: column; /* 允許英文多行單字由上至下垂直排列 */
            align-items: center; /* 強迫 Flex 子元素水平絕對置中 */
            justify-content: center; /* 強迫 Flex 子元素垂直絕對置中 */
            text-align: center; /* 強制文字內部區塊置中 */
            font-size: clamp(13px, 2.3vh, 18px); /* 調降文字上限 (22px -> 18px)，防止長英文單字頂到外框 */
            font-weight: 9
